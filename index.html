<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Splice — a daily word chain</title>
<meta name="description" content="Splice: chain words by their overlapping ends to reach the target in as few words as possible.">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button type="button" class="icon-btn" id="btn-menu" aria-label="Menu" aria-haspopup="dialog">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 class="logo">splice<span class="dot">.</span></h1>
    <div class="par-pill" id="par-pill">PAR –</div>
  </header>

  <div class="subbar">
    <span id="puzzle-label">Loading…</span>
    <span class="subbar-actions">
      <button type="button" class="link-btn" id="btn-new-practice" hidden>New puzzle</button>
    </span>
  </div>

  <section class="target-panel" aria-label="Target">
    <div>
      <div class="label">TARGET</div>
      <div class="target-word" id="target-word">·····</div>
    </div>
    <div class="pips" id="pips" aria-hidden="true"></div>
  </section>

  <main class="chain-wrap" id="chain-wrap">
    <ol class="chain" id="chain" aria-label="Your chain"></ol>
    <p class="helper" id="helper"></p>
  </main>

  <div class="actions" id="actions">
    <button type="button" class="pill-btn" id="btn-undo">Undo</button>
    <button type="button" class="pill-btn" id="btn-hint">Hint</button>
    <button type="button" class="pill-btn" id="btn-giveup">Give up</button>
    <button type="button" class="pill-btn" id="btn-result" hidden>See result</button>
  </div>

  <div class="keyboard" id="keyboard" role="group" aria-label="Keyboard"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button type="button" class="icon-btn" id="btn-sheet-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<noscript><p style="padding:24px;font-family:sans-serif">Splice needs JavaScript to run.</p></noscript>
</body>
</html>
